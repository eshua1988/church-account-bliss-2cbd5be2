name: Deploy Supabase Functions

on:
  push:
    branches: ['main']
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          for fn in google-sheets sheets-export public-transactions submit-public-payout submit-public-deposit validate-payout-token send-push-notification add-images-to-payout generate-payout-pdf upload-payout-pdf check-pending-payouts telegram-bot banking-auth-start banking-auth-complete banking-sync; do
            if [ "$fn" = "google-sheets" ] || [ "$fn" = "sheets-export" ]; then
              # The function handles CORS preflight and validates the JWT itself.
              # Gateway JWT verification would reject browser OPTIONS requests first.
              supabase functions deploy $fn --no-verify-jwt --project-ref htepbcotdqrewbxmasbf
            else
              supabase functions deploy $fn --project-ref htepbcotdqrewbxmasbf
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
