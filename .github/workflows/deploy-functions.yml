name: Deploy Supabase Functions

on:
  push:
    branches: ['main']
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        run: |
          for fn in google-sheets public-transactions submit-public-payout submit-public-deposit validate-payout-token send-push-notification add-images-to-payout generate-payout-pdf upload-payout-pdf check-pending-payouts restore-payout-notifications telegram-bot banking-auth-start banking-auth-complete banking-sync; do
            supabase functions deploy $fn --project-ref htepbcotdqrewbxmasbf
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
